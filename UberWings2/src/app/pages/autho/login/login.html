<main
  class="bg-linear-to-br from-blue-200 via-gray-300 to-yellow-200 w-full min-h-screen flex items-center justify-center"
>
  <!--bg-linear-to-tr from-cyan-300/20 to via-violet-700-->
  <div
    class="bg-slate-300/50 flex flex-col w-full max-w-md lg:max-w-md place-items-center rounded-xl backdrop-blur-3xl shadow-2xl ring-3 ring-orange-600 py-5"
  >
    <img
      src="/assets/Login/carrito-de-compras.png"
      alt="Icono de carrito de compras"
      class="bg-white h-28 w-auto object-contain rounded-full"
    />

    <h1 class="text-black text-2xl font-bold py-4">Iniciar Sesion</h1>

    <form
      class="flex flex-col gap-4 min-h-64 w-auto place-items-center"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="relative flex flex-col px-5">
        <label for="email" class="my-2 block text-black text-sm font-bold">
          Correo Electronico <span [class.text-red-500]="isEmailRequired || isEmailInvalid">*</span>
        </label>
        <!--absolute left-6 top-3/4 -translate-y-4/6-->
        <span class="absolute left-6 top-4/6 -translate-y-2/6">
          <img
            src="/assets/Login/agregar-usuario (1).png"
            alt="Icono-de-usuario"
            class="h-8 w-auto object-contain rounded-full bg-white"
          />
        </span>

        <input
          type="email"
          id="email"
          name="email"
          formControlName="email"
          placeholder="Usuario"
          class="placeholder-white text-white text-2xl bg-transparent w-full pl-10 px-3 py-2 border rounded-lg"
          [class.border-red-500]="isEmailRequired || isEmailInvalid"
        />
      </div>
      @if (isEmailRequired) {
        <p class="text-black font-bold bg-red-100 ring-2 ring-red-500 rounded-lg p-2 text-md mt-1">
          El correo electronico es requerido.
        </p>
      }

      @if (isEmailInvalid) {
        <p class="text-black font-bold bg-red-100 ring-2 ring-red-500 rounded-lg p-2 text-md mt-1">
          Ingrese un correo electronico valido.
        </p>
      }

      <div class="relative flex flex-col">
        <label for="password" class="my-2 block text-black text-sm font-bold">
          Contraseña <span [class.text-red-500]="isPasswordRequired">*</span>
        </label>
        <!--absolute left-1 top-1/3 translate-y-1/2-->
        <span class="absolute left-1 top-4/6 -translate-y-1/3">
          <img
            src="/assets/Login/bloqueado.png"
            alt="Icono-de-contraseña-segura"
            class="h-8 w-auto object-contain rounded-full bg-white"
          />
        </span>

        <input
          type="password"
          id="password"
          name="password"
          formControlName="password"
          placeholder="Contraseña"
          class="placeholder-white text-white text-2xl bg-transparent w-full pl-10 px-3 py-2 border rounded-lg"
          [class.border-red-500]="isPasswordRequired"
        />
      </div>

      @if (isPasswordRequired) {
        <p class="text-black font-bold bg-red-100 ring-2 ring-red-500 rounded-lg p-2 text-md mt-1">
          La contraseña es requerida.
        </p>
      }

      <div class="flex justify-center w-full col-span-full">
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          aria-label="Ingresar sesion a formulario de registro"
          class="bg-orange-300 hover:bg-orange-500 hover:text-white text-black font-bold py-4 px-4 rounded cursor-pointer disabled:cursor-not-allowed disabled:opacity-25 disabled:bg-cyan-800"
        >
          Iniciar Sesion
        </button>
      </div>

      <div class="flex justify-end w-full">
        <p class="text-md text-black font-semibold cursor-pointer hover:underline">
          Olvidastes tu contraseña?
        </p>
      </div>
    </form>
  </div>
</main>
